# rundown 实验注册表. 一条记录 = 一个 sweep (笛卡尔积 variants).
# 一组 trials = 多次 train, 通过 subprocess 调 rundown.cli train 启动.
#
# MVP 阶段: 只支持 mode=cartesian (枚举 variants 列表).
# optuna / TPE search 等 Phase 2 (用 --kwargs 自由透传实现).
#
# 字段 (跟 models.yaml 的边界):
#   dataset          数据集 alias (must exist in configs/datasets.yaml)
#   model            模型 alias (must exist in configs/models.yaml)
#   epochs_max       每个 trial 跑几个 epoch
#   variants         mode=cartesian 枚举这些 variant 名 (顺序跑)
#                    — 引用 models.yaml 里该 model 的 variants, 不重定义.
#   steps_per_epoch  可选, 覆盖 engine 默认 50
#   batch_size       可选, 覆盖 provider 默认
#   optimizer        可选, {kind, lr[, weight_decay]} — 覆盖 defaults.DEFAULT_OPTIMIZER
#                    例: {kind: adam, lr: 0.0005} (sweep 用更低 lr 探索)
#                    sweep 内通过 subprocess CLI 透传给每个 trial.
#
# 可选 trainer 字段 (C3 起生效):
#   trainer          trainer 名称 (alias 或 dotted path).
#                      alias:    configs/trainers.yaml 注册过, 或内置 "gradient".
#                      dotted:   "myproj.trainers.JointTrainer".
#                    sweep 内给 subprocess 加 ``--trainer <value>``;
#                    trial 端按 CLI 解析优先级 (CLI > experiments.yaml >
#                    model.default_trainer > "gradient") 决定最终 trainer.
#   trainer_config   dict, 给 subprocess 加 ``--trainer-config <json>``.
#                    启动前 JSON 校验 (L15); 非 JSON 可序列化 → ValueError.
#                    例: {alpha: 0.5, stages: [warmup, finetune]}
#   metric           sweep 汇总指标名 (例如 "best_val_mse", "best_val_loss",
#                    或 trainer 自定义的 primary_metric).
#                    优先级: exp.metric > trial.manifest.config.primary_metric
#                    > "best_val_mse".
#
# 不在 experiments 的字段:
#   ❌ factory.target / factory.kwargs — 这些在 models.yaml
#   ❌ hidden / num_layers 等 — models.variants 是预设, --kwargs 是自由透传

experiments:

  # ETTh1 LSTM 三种 size 对比 (默认 variants 列表即笛卡尔积)
  etth1_lstm_size_sweep:
    dataset: etth1
    model: lstm
    epochs_max: 5
    optimizer: {kind: adam, lr: 0.001}     # 可选, 不写走 defaults.DEFAULT_OPTIMIZER
    variants: [small, large, deep]
    # 3 trials; run_id 格式: lstm__var{small|large|deep}__etth1__seed{0,1,2}
    #
    # C3 字段示例 (注释掉, 不影响当前 sweep):
    #   trainer: myproj.trainers.JointTrainer     # dotted path
    #   trainer_config:                            # 透传给 trainer.fit()
    #     alpha: 0.5
    #     stages: [warmup, finetune]
    #   metric: best_val_mse                       # sweep 汇总用这个 metric
