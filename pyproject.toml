[project]
name = "rundown"
version = "0.1.0"
description = "声明式运行 · 持久产物 · 为 Agent 而生"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "rundown contributors" }]
dependencies = [
    "numpy>=1.23,<2.0",
    "pandas>=2.0,<3.0",
    "pyyaml>=6.0",
    "torch>=2.1",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# optuna 预留给未来的 optuna 智能超参模式 (Phase 2); 当前 `experiment run`
# 只支持 cartesian 笛卡尔积扫描, 不需要 optuna. 不安装也能正常跑实验.
optuna = ["optuna>=3.0"]

[project.scripts]
rundown = "rundown.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rundown*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra -q"
